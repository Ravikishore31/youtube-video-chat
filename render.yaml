# Deploy this repository as a Blueprint on Render.
services:
  - type: web
    name: youtube-video-chat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-lock.txt
    startCommand: python -m streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: REQUIRE_USER_KEYS
        value: "true"
      - key: ANONYMIZED_TELEMETRY
        value: "false"
